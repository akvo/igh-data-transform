name: Lint & Test
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff (linting)
        run: bash scripts/qa.sh lint

      - name: Run Ruff (formatting check)
        run: bash scripts/qa.sh format

      - name: Run tests
        run: bash scripts/qa.sh test
